services:

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=diabetes
      - POSTGRES_PASSWORD=diabetes
      - POSTGRES_DB=diabetes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diabetes -d diabetes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow
      - --serve-artifacts
      - --allowed-hosts
      - "*"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://diabetes:diabetes@postgres:5432/diabetes_db
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/predict
    depends_on:
      - api

volumes:
  postgres_data:
